name: nostrsearch

services:
  # ── Unified node ───────────────────────────────────────────────────────────
  # ONE process: search API + archive HTTP + nostr archive relay + live
  # firehose, all over a shared Tantivy index, one archive database, and one
  # stats/WoT engine. Writes are serialized through a single writer task, and
  # the search reader auto-reloads on commit, so relay/firehose events become
  # searchable within the commit interval.
  server:
    image: registry.v0l.io/nostrsearch:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      INDEX_ROOT: /data/index
      BIND: 0.0.0.0:8080
      RUST_LOG: nostrsearch=info,tower_http=info
      # Publish the raw .jsonl.zst corpus at /archive and archive into it.
      ARCHIVE_DIR: /data/archive
      STATE_DIR: /data/stats
      WOT_OUT: /data/wot.bin
      # Accept inbound writes at / (nostr archive relay). Relay events are
      # archived AND indexed AND folded into stats by the same process.
      ENABLE_RELAY: "1"
      # Comma-separated upstream relays enable the live firehose in-process.
      RELAYS: "wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net"
    volumes:
      - index-data:/data
    # Search is mmap-heavy; give the page cache room. Tune to the host.
    deploy:
      resources:
        limits:
          memory: 24G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── One-shot archive ingest ────────────────────────────────────────────────
  # Unified pipeline in backfill mode: streams a directory of Nostr JSONL dumps
  # (.jsonl/.json/.zst/.gz/.bz2) into BOTH the Tantivy index and the stats/WoT
  # engine, then exits. Run on demand:
  #
  #   DUMPS_DIR=/path/to/dumps docker compose --profile ingest run --rm ingest
  #
  # Writes into the same index volume the server reads. Analysis state persists
  # under /data/stats so a later run (or the firehose) warm-starts with WoT.
  ingest:
    image: registry.v0l.io/nostrsearch:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["ingest"]
    restart: "no"
    entrypoint: ["./bin/ingest"]
    command:
      - "--index-root"
      - "/data/index"
      - "--input-dir"
      - "/dumps"
      - "--heap-mb"
      - "512"
      - "--commit-docs"
      - "200000"
      # Stats/WoT are computed from the same stream and hot-swapped into scoring.
      - "--state-dir"
      - "/data/stats"
      - "--wot-out"
      - "/data/wot.bin"
    environment:
      RUST_LOG: nostrsearch=info,nostr_archive_cursor=info
    volumes:
      - index-data:/data
      - ${DUMPS_DIR:-./dumps}:/dumps:ro
    deploy:
      resources:
        limits:
          memory: 16G

  # ── Standalone firehose (ALTERNATIVE to the node's built-in firehose) ──────
  # The `server` node already runs the firehose in-process when RELAYS is set,
  # which is the normal deployment. Use this only if you want the writer in a
  # separate container — in which case the server MUST run without RELAYS and
  # without ENABLE_RELAY, since only one process may hold the Tantivy writer
  # and the archive's RocksDB index lock.
  #
  #   docker compose --profile firehose up -d firehose
  firehose:
    image: registry.v0l.io/nostrsearch:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["firehose"]
    restart: unless-stopped
    entrypoint: ["./bin/ingest"]
    command:
      - "--index-root"
      - "/data/index"
      - "--relays"
      - "wss://relay.damus.io"
      - "--relays"
      - "wss://nos.lol"
      - "--relays"
      - "wss://relay.primal.net"
      # Archive every received event as .jsonl.zst + id index (nostrhole role).
      - "--archive-dir"
      - "/data/archive"
      - "--state-dir"
      - "/data/stats"
      - "--wot-out"
      - "/data/wot.bin"
      - "--wot-refresh-every"
      - "100000"
    environment:
      RUST_LOG: nostrsearch=info
    volumes:
      - index-data:/data
    deploy:
      resources:
        limits:
          memory: 8G

  # ── One-shot stats-only / web-of-trust backfill ────────────────────────────
  # Stats WITHOUT indexing: streams the dumps through the analysis pipeline
  # (FollowGraph + Pagerank) and writes /data/wot.bin + /data/stats only.
  # The unified `ingest`/`firehose` services already do this inline, so this is
  # for computing WoT ahead of a first index build (so the very first documents
  # are written with real trust tiers instead of 0):
  #
  #   DUMPS_DIR=/path/to/dumps docker compose --profile stats run --rm stats
  #
  # Analysis state is persisted under /data/stats (resumable / additive).
  stats:
    image: registry.v0l.io/nostrsearch:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["stats"]
    restart: "no"
    entrypoint: ["./bin/stats"]
    command:
      - "--input-dir"
      - "/dumps"
      - "--state-dir"
      - "/data/stats"
      - "--wot-out"
      - "/data/wot.bin"
    environment:
      RUST_LOG: nostrsearch=info,nostr_archive_cursor=info
    volumes:
      - index-data:/data
      - ${DUMPS_DIR:-./dumps}:/dumps:ro
    deploy:
      resources:
        limits:
          memory: 16G

volumes:
  index-data:
    driver: local
