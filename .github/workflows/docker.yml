name: Build and Push Docker Image

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # One build per ref; a newer push supersedes an in-flight one. The image
  # build is expensive (RocksDB + fat LTO), so don't run duplicates.
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # librocksdb-sys needs clang/libclang to build the archive id index.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev llvm-dev

      - uses: Swatinem/rust-cache@v2

      # The server crate compiles the console bundle in with include_str!, so
      # it has to exist before cargo runs.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build the operator console
        run: ./scripts/build-dashboard.sh

      - name: Test
        run: cargo test --workspace --locked

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: voidic
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest + immutable sha tag so a deploy can be rolled back to a
      # specific commit, plus semver tags when pushing a v* tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: voidic/nostrsearch
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
