# One-shot stats / web-of-trust backfill Job. Streams the Nostr JSONL dumps
# through the analysis pipeline (FollowGraph + Pagerank) and writes a WoT
# snapshot to /data/wot.bin on the shared index volume. Run this BEFORE the
# ingest Job so indexed documents carry a `wot_tier` scoring signal.
#
# Analysis state is persisted under /data/stats (resumable / additive), so
# adding a new analysis later re-scrapes only that analysis.
#
#   kubectl apply -f k8s/stats-job.yaml
#   kubectl -n nostrsearch logs -f job/nostrsearch-stats
apiVersion: batch/v1
kind: Job
metadata:
  name: nostrsearch-stats
  namespace: nostrsearch
  labels:
    app.kubernetes.io/name: nostrsearch
    app.kubernetes.io/component: stats
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nostrsearch
        app.kubernetes.io/component: stats
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: stats
          image: registry.v0l.io/nostrsearch:latest
          imagePullPolicy: Always
          command: ["./bin/stats"]
          args:
            - "--input-dir"
            - "/dumps"
            - "--state-dir"
            - "/data/stats"
            - "--wot-out"
            - "/data/wot.bin"
          env:
            - name: RUST_LOG
              value: nostrsearch=info,nostr_archive_cursor=info
          volumeMounts:
            - name: index-data
              mountPath: /data
            - name: dumps
              mountPath: /dumps
              readOnly: true
          resources:
            requests:
              memory: 4Gi
            limits:
              memory: 16Gi
      volumes:
        - name: index-data
          persistentVolumeClaim:
            claimName: nostrsearch-index
        - name: dumps
          # Point this at wherever your dumps live (same as the ingest Job).
          emptyDir: {}
