# nostrsearch — single deployment manifest.
#
#   kubectl apply -f k8s/nostrsearch.yaml
#
# This runs the unified node: ONE process serving the search API, the archive
# HTTP endpoints, the nostr archive relay, and the live firehose, all over a
# shared Tantivy index, one archive database, and one stats/WoT engine.
#
# Everything optional is an env var below — uncomment to turn a role on or off.
# Bulk archive backfill is a separate one-shot Job, commented out at the bottom.
#
# DO NOT run the backfill by overriding this Deployment's command/args unless
# you also pass `--bind`: the liveness probe below expects /healthz, and the
# ingest binary serves no HTTP until it is given a bind address, so kubelet
# kills the container on a fixed schedule (~140s: three failed probes plus the
# termination grace period) with exit 137 — which looks exactly like an OOM
# kill but is reported as Reason: Error, not OOMKilled.
#
# With `--bind 0.0.0.0:8080` the ingest serves /healthz, a static "ingest in
# progress" page at /, and the archive files at /archive — so a backfill that
# runs for hours keeps the port answering and keeps publishing the corpus,
# instead of refusing connections until it finishes.
---
apiVersion: v1
kind: Namespace
metadata:
  name: nostrsearch
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nostrsearch-index
  namespace: nostrsearch
  labels:
    app.kubernetes.io/name: nostrsearch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  # storageClassName: standard   # set to your cluster's storage class
---
apiVersion: v1
kind: Service
metadata:
  name: nostrsearch
  namespace: nostrsearch
  labels:
    app.kubernetes.io/name: nostrsearch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nostrsearch
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nostrsearch
  namespace: nostrsearch
  labels:
    app.kubernetes.io/name: nostrsearch
spec:
  # Only ONE replica may write: it holds the Tantivy writer and the archive's
  # exclusive RocksDB index lock. Scaling out requires read-only replicas
  # (drop ENABLE_RELAY + RELAYS) on a ReadWriteMany volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nostrsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nostrsearch
    spec:
      # The node flushes the search index on SIGTERM; without enough grace the
      # last commit interval of events is lost from the index.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: nostrsearch
          image: voidic/nostrsearch:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # ── Core ────────────────────────────────────────────────────────
            - name: INDEX_ROOT
              value: /data/index
            - name: BIND
              value: 0.0.0.0:8080
            - name: RUST_LOG
              value: nostrsearch=info,tower_http=info

            # ── Archive (serves the raw .jsonl.zst corpus at /archive) ──────
            # Comment out to run search-only against an existing index.
            - name: ARCHIVE_DIR
              value: /data/archive

            # ── Indexing: live firehose ─────────────────────────────────────
            # Comma-separated upstream relays. Events are archived, indexed and
            # folded into stats by this same process. Comment out to stop
            # ingesting (the node then serves search/archive read-only).
            - name: RELAYS
              value: "wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net"

            # ── Indexing: inbound relay (accept writes at /) ────────────────
            # Comment out to refuse inbound writes.
            - name: ENABLE_RELAY
              value: "1"
            # Restrict which kinds the relay accepts:
            # - name: RELAY_KINDS
            #   value: "0,1,3,7,30023"

            # ── Stats / web-of-trust ────────────────────────────────────────
            # Continuous full-network gap scraper (on by default when this
            # node is the writer and has an archive). Discovers relays from
            # kind-10002, negentropy-syncs day-by-day backwards, records each
            # relay's data horizon after 14 empty days. SCRAPE=0 disables;
            # tune with SCRAPE_MIN_DATE, SCRAPE_MAX_RELAYS (200),
            # SCRAPE_CONCURRENCY (8), SCRAPE_FLOOR_MINS (10),
            # SCRAPE_BIRTHDAY_DAYS (14), SCRAPE_PASS_INTERVAL_SECS (1800),
            # SCRAPE_REDISCOVER_SECS (86400).
            # - name: SCRAPE
            #   value: "0"
            # Shard writers held open at once; total writer heap is roughly
            # this x the per-shard heap (~4GB at 64 x 64MB). Keep it at or
            # above the number of months the corpus spans — dumps are often
            # not date-ordered, and a smaller cap evicts writers that are
            # immediately needed again, paying a commit + fsync each time.
            # ── File descriptors ────────────────────────────────────────────
            # There is deliberately no ulimit/nofile setting here: the Pod spec
            # has no such field (kubernetes#3595; KEP-5758 is adding
            # securityContext.ulimits but it is not GA). Containers inherit the
            # runtime's limits, and containerd dropped LimitNOFILE from its
            # unit (containerd#8924) in favour of systemd's implicit
            # 1024 soft / 524288 hard — so pods get a 1024 soft limit.
            #
            # That PR's stated expectation is that software needing more should
            # raise its own soft limit, which is exactly what the server does at
            # startup (soft -> hard, no privileges required). It logs the result
            # as `file descriptor limit` and warns if the hard limit is low.
            #
            # Only if that warning fires does a node-level change help, e.g.
            #   /etc/systemd/system/containerd.service.d/limits.conf
            #   [Service]
            #   LimitNOFILE=1024:1048576
            - name: MAX_OPEN_SHARDS
              value: "64"
            # Shard *readers* held open for serving, LRU-evicted beyond this.
            # Unlike writers these are cheap to reopen, so the cap exists to
            # bound descriptors and reload-watcher threads, not memory.
            - name: MAX_OPEN_SHARD_READERS
              value: "48"
            # ── Admin endpoints (NIP-98 authenticated) ─────────────────────
            # Comma-separated npub/hex allowed to call /admin/*. Unset (the
            # default) means the routes are never mounted, so a misconfigured
            # deploy exposes nothing rather than everything. Callers sign a
            # kind-27235 event naming the exact URL + method, so no secret is
            # ever transmitted.
            #   POST /admin/analyses/{name}/reset    re-derive one report
            #   POST /admin/scrape/reset?relay=&from=&to=   re-scrape days
            #   POST /admin/scrape/relay/reset?relay=       clear learned state
            # - name: ADMIN_PUBKEYS
            #   value: "npub1..."
            # Public origin, so the signed `u` tag is checked against the real
            # external URL and not just the path.
            # - name: ADMIN_ORIGIN
            #   value: "https://archive.v0l.io"
            - name: STATE_DIR
              value: /data/stats
            - name: WOT_OUT
              value: /data/wot.bin
            # Events between WoT rebuilds (default 100000). Lower = fresher
            # trust scoring, more CPU spent re-materializing.
            # - name: WOT_REFRESH_EVERY
            #   value: "100000"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: 4Gi
            limits:
              # Search is mmap-heavy; give the page cache room.
              memory: 24Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nostrsearch-index

# ── Optional: one-shot bulk archive backfill ──────────────────────────────────
#
# Loads historical JSONL dumps into the index and seeds the web-of-trust graph.
# Worth running before first serving: WoT cannot bootstrap from the live
# firehose alone (a live tail sees only a handful of kind-3 contact lists, far
# below the follower thresholds), so without a backfill everything indexes at
# tier 0 and ranking is pure BM25 + recency.
#
# Only one process may write at a time, so scale the Deployment down first:
#
#   kubectl -n nostrsearch scale deploy/nostrsearch --replicas=0
#   kubectl apply -f k8s/nostrsearch.yaml   # with the Job uncommented
#   kubectl -n nostrsearch logs -f job/nostrsearch-ingest
#   kubectl -n nostrsearch scale deploy/nostrsearch --replicas=1
#
# `--exit-when-done` below matters for the Job form: by default the ingest
# binary idles once it finishes instead of exiting, because anything with a
# restart policy of Always treats a clean exit as a reason to run the whole
# backfill again. A Job wants the opposite -- exit so it can be marked
# complete.
#
# To rebuild after an archive-cursor change, add `--rebuild`: it rebuilds the
# archive id index (recording each event's location) and then reindexes into a
# fresh Tantivy index. It is O(corpus) twice over, so run it deliberately.
#
# ---
# apiVersion: batch/v1
# kind: Job
# metadata:
#   name: nostrsearch-ingest
#   namespace: nostrsearch
# spec:
#   backoffLimit: 0
#   template:
#     spec:
#       restartPolicy: Never
#       securityContext:
#         runAsNonRoot: true
#         runAsUser: 10001
#         fsGroup: 10001
#       containers:
#         - name: ingest
#           image: voidic/nostrsearch:latest
#           command: ["./bin/ingest"]
#           args:
#             - "--index-root"
#             - "/data/index"
#             - "--input-dir"
#             - "/dumps"
#             - "--state-dir"
#             - "/data/stats"
#             - "--wot-out"
#             - "/data/wot.bin"
#             # Bound writer heap: max-open-shards x heap-mb.
#             # Ingest keeps a persistent seen-id set in <index>/.dedupe and
#             # checkpoints it after Tantivy commits, so re-running or
#             # restarting a backfill resumes instead of duplicating documents.
#             # Wiping /data/index also wipes the seen-set, keeping them in sync.
#             - "--max-open-shards"
#             - "64"
#             - "--heap-mb"
#             - "64"
#             # Serve /healthz + / (status page) + /archive during the run, so
#             # the port answers for the hours this takes and the corpus stays
#             # downloadable. Search is NOT served: the index is half-built.
#             - "--bind"
#             - "0.0.0.0:8080"
#             # A Job should finish; the default is to idle (see above).
#             - "--exit-when-done"
#           ports:
#             - name: http
#               containerPort: 8080
#           env:
#             - name: RUST_LOG
#               value: nostrsearch=info,nostr_archive_cursor=info
#           volumeMounts:
#             - name: data
#               mountPath: /data
#             - name: dumps
#               mountPath: /dumps
#               readOnly: true
#           resources:
#             requests:
#               memory: 4Gi
#             limits:
#               memory: 16Gi
#       volumes:
#         - name: data
#           persistentVolumeClaim:
#             claimName: nostrsearch-index
#         - name: dumps
#           # Point at wherever your dumps live.
#           emptyDir: {}
