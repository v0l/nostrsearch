apiVersion: apps/v1
kind: Deployment
metadata:
  name: nostrsearch-server
  namespace: nostrsearch
  labels:
    app.kubernetes.io/name: nostrsearch
    app.kubernetes.io/component: server
spec:
  # The index is mmap-heavy and served from a single RWO PVC; keep to 1 replica
  # unless you switch to a ReadWriteMany volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nostrsearch
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nostrsearch
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: server
          image: registry.v0l.io/nostrsearch:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INDEX_ROOT
              value: /data/index
            - name: BIND
              value: 0.0.0.0:8080
            - name: RUST_LOG
              value: nostrsearch=info,tower_http=info
          volumeMounts:
            - name: index-data
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: 4Gi
            limits:
              memory: 24Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: index-data
          persistentVolumeClaim:
            claimName: nostrsearch-index
