# One-shot ingest Job. Loads Nostr JSONL dumps into the shared index volume.
# The dumps must be made available at /dumps (edit the volume below to point at
# your source — e.g. a separate PVC, hostPath, or an initContainer that fetches
# them). Because the index PVC is ReadWriteOnce, scale the server Deployment to
# 0 (or run this on the same node) while ingesting.
#
#   kubectl apply -f k8s/ingest-job.yaml
#   kubectl -n nostrsearch logs -f job/nostrsearch-ingest
apiVersion: batch/v1
kind: Job
metadata:
  name: nostrsearch-ingest
  namespace: nostrsearch
  labels:
    app.kubernetes.io/name: nostrsearch
    app.kubernetes.io/component: ingest
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nostrsearch
        app.kubernetes.io/component: ingest
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: ingest
          image: registry.v0l.io/nostrsearch:latest
          imagePullPolicy: Always
          command: ["./bin/ingest"]
          args:
            - "--index-root"
            - "/data/index"
            - "--input-dir"
            - "/dumps"
            - "--heap-mb"
            - "512"
            - "--commit-docs"
            - "200000"
          env:
            - name: RUST_LOG
              value: nostrsearch=info,nostr_archive_cursor=info
          volumeMounts:
            - name: index-data
              mountPath: /data
            - name: dumps
              mountPath: /dumps
              readOnly: true
          resources:
            requests:
              memory: 4Gi
            limits:
              memory: 16Gi
      volumes:
        - name: index-data
          persistentVolumeClaim:
            claimName: nostrsearch-index
        - name: dumps
          # Point this at wherever your dumps live.
          emptyDir: {}
