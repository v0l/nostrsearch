# ALTERNATIVE standalone firehose writer.
#
# The nostrsearch-server Deployment already runs the firehose in-process when
# RELAYS is set, which is the normal deployment. Use this only to run the
# writer separately — in which case the server Deployment MUST drop RELAYS and
# ENABLE_RELAY, since only one process may hold the Tantivy writer and the
# archive's RocksDB index lock.
#
# The index PVC is ReadWriteOnce, so this must also not run concurrently with
# the ingest Job, and needs to be scheduled on the same node as the server
# (or switch the PVC to ReadWriteMany).
#
#   kubectl apply -f k8s/firehose-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nostrsearch-firehose
  namespace: nostrsearch
  labels:
    app.kubernetes.io/name: nostrsearch
    app.kubernetes.io/component: firehose
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nostrsearch
      app.kubernetes.io/component: firehose
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nostrsearch
        app.kubernetes.io/component: firehose
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: firehose
          image: registry.v0l.io/nostrsearch:latest
          imagePullPolicy: Always
          command: ["./bin/ingest"]
          args:
            - "--index-root"
            - "/data/index"
            - "--relays"
            - "wss://relay.damus.io"
            - "--relays"
            - "wss://nos.lol"
            - "--relays"
            - "wss://relay.primal.net"
            - "--archive-dir"
            - "/data/archive"
            - "--state-dir"
            - "/data/stats"
            - "--wot-out"
            - "/data/wot.bin"
            - "--wot-refresh-every"
            - "100000"
          env:
            - name: RUST_LOG
              value: nostrsearch=info
          volumeMounts:
            - name: index-data
              mountPath: /data
          resources:
            requests:
              cpu: "250m"
              memory: 2Gi
            limits:
              memory: 8Gi
      volumes:
        - name: index-data
          persistentVolumeClaim:
            claimName: nostrsearch-index
