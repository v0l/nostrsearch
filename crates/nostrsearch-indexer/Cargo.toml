[package]
name = "nostrsearch-indexer"
description = "Parallel JSONL ingest + time-sharded Tantivy index writer for Nostr events"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rand = { workspace = true }
nostrsearch-archive = { path = "../nostrsearch-archive" }
nostrsearch-core = { path = "../nostrsearch-core" }
nostrsearch-stats = { path = "../nostrsearch-stats" }
tantivy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
axum.workspace = true
bytes.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tracing-subscriber.workspace = true
nostr-archive-cursor = { git = "https://github.com/v0l/nostr-archive-cursor.git", default-features = false, features = ["sync", "db-rocksdb"] }
nostr-sdk = "0.44"
rustls = { version = "0.23", features = ["ring"] }
libc = "0.2"
rocksdb = "0.24"
bincode = "1.3"
chrono.workspace = true
clap = { version = "4.6.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true }
zstd = { workspace = true }
