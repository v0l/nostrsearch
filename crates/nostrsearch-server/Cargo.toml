[package]
name = "nostrsearch-server"
description = "REST search API + shard fan-out over the Nostr Tantivy indices"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nostrsearch-core = { path = "../nostrsearch-core" }
nostrsearch-indexer = { path = "../nostrsearch-indexer" }
nostrsearch-stats = { path = "../nostrsearch-stats" }
tantivy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
chrono.workspace = true
hex.workspace = true
tokio-util = { workspace = true }
nostr-archive-cursor = { git = "https://github.com/v0l/nostr-archive-cursor.git", default-features = false, features = ["sync", "db-rocksdb"] }
nostr-relay-builder = "0.44"
nostr-sdk = "0.44"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
sha1 = "0.10"
base64 = "0.22"
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
tempfile = "3"
