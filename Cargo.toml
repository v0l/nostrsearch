[workspace]
resolver = "3"
members = [
    "crates/nostrsearch-archive",
    "crates/nostrsearch-core",
    "crates/nostrsearch-indexer",
    "crates/nostrsearch-server",
    "crates/nostrsearch-stats",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/v0l/nostrsearch"

[workspace.dependencies]
# --- core ---
tantivy = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
bech32 = "0.11"
chrono = { version = "0.4", features = ["serde"] }

# --- async / server ---
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures = "0.3"

# --- ingest ---
zstd = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
bytes = "1"

[profile.release]
# Thin LTO, not fat, and the default codegen-unit count.
#
# The app layer of a Docker build can never be cached -- it changes whenever
# any source file does -- so whatever it costs is paid on every single build,
# times five binaries. Measured on this workspace, relinking one binary after a
# one-line edit: fat LTO with codegen-units=1 takes 58s, thin LTO with the
# default 16 units takes 4s. Across five binaries that is roughly five minutes
# per build against twenty seconds.
#
# Thin LTO still optimises across crate boundaries and normally lands within a
# couple of percent of fat on runtime performance, which is a good trade here:
# ingest is dominated by Tantivy internals, mmap faults and syscalls rather
# than by cross-crate inlining in our own code.
#
# For a genuinely maximal build, override at the command line without editing
# this file:
#   CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 cargo build --release
lto = "thin"
codegen-units = 16
opt-level = 3
# keep symbols for profiling the hot path
debug = false
panic = "abort"
